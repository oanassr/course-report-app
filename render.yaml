services:
  - type: web
    name: course-report-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python course_report_app/preload_ocr.py
    startCommand: python course_report_app/server.py
    autoDeployTrigger: commit
    healthCheckPath: /health
    # Render free tier has 512 MB RAM. OCR on large scanned plans can be
    # memory-intensive; the app skips OCR when text extraction succeeds.
    envVars:
      - key: RENDER
        value: "1"
